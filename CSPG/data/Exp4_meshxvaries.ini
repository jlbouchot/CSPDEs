## Exp4 -- the base mesh h0 = 1/mesh_x varies at FIXED target h_L.
##
## The sweep holds  mesh_x * 2^L = 640  and  L - J = 2  on every row, so every
## run discretises on the SAME three grids (160^2, 320^2, 640^2) and spends the
## SAME tolerance; only the sparsity schedule moves.  See testing/launchExp4.sh
## for the (mesh_x, J, L) grid and why it is built that way.
##
## Everything below the mesh block is byte-identical to Exp1_hfvaries.ini, so
## the parametric coefficient, the QoI and the element degree are shared with
## Exp1/Exp2/Exp3.  That is deliberate: the ground-truth identity is then the
## same and Exp4 scores against the reference those experiments already use
## (d=20, GTresults_d20Hrich640-1280-2560_9154097c).  Do not retune a constant
## here without re-reading utilities/gt_meta.py: power, weight_cosine,
## fluctuation_importance, abar, qoi and degree are all part of that identity.
##
## Theory conditions, with power(mu)=5, exponent(alpha)=0.1, p_0=p_t=0.33:
##     mu > 5 alpha + 4            5    > 4.5      OK
##     p  > (2 alpha + 1)/(alpha + mu - 1)
##                                 0.33 > 0.29268  OK
## Both hold with the same margin as Exp1/Exp2/Exp3; mesh_x is not part of
## either condition, so every row of the sweep is inside the hypotheses.

[main]
output_file=SIMPLETEST
experiment_name=results/testMLCSPG
no_compute=False
n=2
## Defaults = the mesh_x=10 row, i.e. the one that coincides with Exp1's L=6.
## launchExp4.sh / Exp4NoBatch.sh override mesh_x, mesh_y, nb_level, l_start.
mesh_x=10
mesh_y=10
nb_level=6
l_start=4
sampling=new
## 0, not 50: the reference is generated once by launchGT.sh and scored from
## the stored file.  CrossCheck draws its test points from the UNSEEDED global
## RNG and rebuilds its own reference per run, so its errors are not comparable
## across rows -- which is the whole point of the experiment.
nb_tests=0
operator=Cheb_Sparse
nb_cosines=10
power=5
weight_cosine=0.5
fluctuation_importance=3.9605
abar=10
exponent=0.1
gamma=1.005
dat_constant=80
const_sj=5
p_0=0.33
p_t=0.33
## box, as in Exp1/Exp2/Exp3's .ini files.  testing/AVGlaunchExp4.sh overrides
## it with --qoi avg; the CLI is applied after the .ini, so this file stays the
## single source of every other parameter for both campaigns.
##   box -> GTresults_d20Hrich640-1280-2560_1182f955   (already generated)
##   avg -> GTresults_d20Hrich640-1280-2560_9154097c   (launchGT.sh --qoi avg)
## If you set it to avg here, write exactly 'avg': 'average' selects the same
## functional but hashes to a different ground-truth folder.
qoi=box

[pdesolver]
preconditioner=none
linear_solver=cholmod

[sparsesolver]
nb_iter=100
recovery_algo=wiht
log=10
numba_threads=6
